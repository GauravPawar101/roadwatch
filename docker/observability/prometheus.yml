global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: gateway-admission
    metrics_path: /metrics/admission
    static_configs:
      - targets:
          - host.docker.internal:3100
        labels:
          service: gateway
          namespace: roadwatch