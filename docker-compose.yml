services:
  # Postgres - Production Database
  postgres:
    image: postgres:15-alpine
    container_name: roadwatch_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: roadwatch
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${TOP_POSTGRES_HOST_PORT:-15433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d roadwatch"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - roadwatch

  pgbouncer:
    # Fix: Changed to edoburu image to match your specific environment variable format
    image: edoburu/pgbouncer:latest
    container_name: roadwatch_pgbouncer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: roadwatch
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 400
      DEFAULT_POOL_SIZE: 50
      RESERVE_POOL_SIZE: 10
      LISTEN_PORT: 6432
      AUTH_TYPE: scram-sha-256
    ports:
      - "${TOP_PGBOUNCER_HOST_PORT:-16432}:6432"
    healthcheck:
      # Pgbouncer needs its own healthcheck so dependent apps don't start prematurely
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1 -p 6432 -d roadwatch"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - roadwatch

  # Kafka HLF — backpressure buffer in front of Fabric anchoring
  zookeeper-hlf:
    image: confluentinc/cp-zookeeper:7.7.0
    container_name: roadwatch_zookeeper_hlf
    restart: unless-stopped
    environment:
      ZK_SERVER_HEAP: "-Xms128m -Xmx256m"
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 5
      ZOOKEEPER_INIT_LIMIT: 10
    ports:
      - "${TOP_ZOOKEEPER_HLF_HOST_PORT:-2181}:2181"
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - roadwatch

  kafka-hlf:
    image: confluentinc/cp-kafka:7.7.0
    container_name: roadwatch_kafka_hlf
    restart: unless-stopped
    depends_on:
      zookeeper-hlf:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx512m"
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-hlf:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9094,PLAINTEXT_INTERNAL://kafka-hlf:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LOG_RETENTION_HOURS: 24
    ports:
      - "${TOP_KAFKA_HLF_HOST_PORT:-9094}:9092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list || exit 1"]
      interval: 30s
      timeout: 60s
      retries: 10
      start_period: 180s
    networks:
      - roadwatch

  # Kafka Events — SLA, notifications, triggers, webhook fan-out
  zookeeper-events:
    image: confluentinc/cp-zookeeper:7.7.0
    container_name: roadwatch_zookeeper_events
    restart: unless-stopped
    environment:
      ZK_SERVER_HEAP: "-Xms128m -Xmx256m"
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 5
      ZOOKEEPER_INIT_LIMIT: 10
    ports:
      - "${TOP_ZOOKEEPER_EVENTS_HOST_PORT:-2182}:2181"
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - roadwatch

  kafka-events:
    image: confluentinc/cp-kafka:7.7.0
    container_name: roadwatch_kafka_events
    restart: unless-stopped
    depends_on:
      zookeeper-events:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx512m"
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-events:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9095,PLAINTEXT_INTERNAL://kafka-events:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LOG_RETENTION_HOURS: 24
    ports:
      - "${TOP_KAFKA_EVENTS_HOST_PORT:-9095}:9092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list || exit 1"]
      interval: 30s
      timeout: 60s
      retries: 10
      start_period: 180s
    networks:
      - roadwatch

  # Redis - Cache
  redis:
    image: redis:7.2-alpine
    container_name: roadwatch_redis
    restart: unless-stopped
    # Production fix: Appendonly set to yes for basic state durability
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${TOP_REDIS_HOST_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - roadwatch

  # Scheduler - Background jobs & Cron jobs
  scheduler:
    build:
      context: .
      dockerfile: services/scheduler/Dockerfile
    container_name: roadwatch_scheduler
    restart: unless-stopped
    depends_on:
      pgbouncer:
        condition: service_healthy
      kafka-events:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@pgbouncer:6432/roadwatch
      SERVICE_NAME: scheduler
      REDIS_URL: redis://redis:6379/0
      KAFKA_EVENTS_BROKERS: kafka-events:29092
      KAFKA_BROKERS: kafka-events:29092
      CRON_SYNC_QUEUE: "*/5 * * * *"
      CRON_KARMA_RECALC: "0 * * * *"
      CRON_SLA_CHECK: "*/30 * * * *"
      CRON_AUDIT_CLEANUP: "0 2 * * *"
      CRON_REPORT_GENERATION: "0 1 * * *"
      LOG_LEVEL: info
    networks:
      - roadwatch
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/health', (r) => {if(r.statusCode !== 200) process.exit(1)})\" || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Webhook Handler - Event Scheduler & Kafka Consumer
  webhook-handler:
    build:
      context: .
      dockerfile: services/webhook-handler/Dockerfile
    container_name: roadwatch_webhook_handler
    restart: unless-stopped
    depends_on:
      pgbouncer:
        condition: service_healthy
      kafka-events:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@pgbouncer:6432/roadwatch
      KAFKA_EVENTS_BROKERS: kafka-events:29092
      KAFKA_BROKERS: kafka-events:29092
      KAFKA_GROUP_ID: webhook-handler-prod
      KAFKA_CONSUMER_TIMEOUT: "3000"
      SERVICE_NAME: webhook-handler
      REDIS_URL: redis://redis:6379/1
      LOG_LEVEL: info
    networks:
      - roadwatch
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/health', (r) => {if(r.statusCode !== 200) process.exit(1)})\" || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Fabric Anchor Consumer - Blockchain Consumer
  fabric-anchor-consumer:
    build:
      context: .
      dockerfile: services/fabric-anchor-consumer/Dockerfile
    container_name: roadwatch_fabric_anchor_consumer
    restart: unless-stopped
    depends_on:
      pgbouncer:
        condition: service_healthy
      kafka-hlf:
        condition: service_healthy
      kafka-events:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@pgbouncer:6432/roadwatch
      KAFKA_HLF_BROKERS: kafka-hlf:29092
      KAFKA_EVENTS_BROKERS: kafka-events:29092
      KAFKA_BROKERS: kafka-hlf:29092
      KAFKA_GROUP_ID: fabric-anchor-consumer-prod
      REDIS_URL: redis://redis:6379/2
      FABRIC_PEER_ENDPOINT: peer0.nhai.example.com:7051
      FABRIC_MSP_ID: NHAIMSP
      FABRIC_CHANNEL_NAME: roadwatch-india
      FABRIC_CHAINCODE_NAME: complaint-anchor
      LOG_LEVEL: info
    networks:
      - roadwatch
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/health', (r) => {if(r.statusCode !== 200) process.exit(1)})\" || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Media Ingest - Image/video processing service
  # Start with: docker compose --profile media up
  media-ingest:
    build:
      context: .
      dockerfile: services/media-ingest/Dockerfile
    container_name: roadwatch_media_ingest
    restart: unless-stopped
    profiles:
      - media
    depends_on:
      pgbouncer:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@pgbouncer:6432/roadwatch
    ports:
      - "${MEDIA_BACKEND_HOST_PORT:-4000}:4000"
    networks:
      - roadwatch

networks:
  roadwatch:
    driver: bridge

volumes:
  postgres_data: