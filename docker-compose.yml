# Development environment - all services run locally
services:
  # Cassandra - Local Development (replacement for Postgres)
  cassandra:
    image: cassandra:4.1
    container_name: roadwatch_cassandra
    restart: unless-stopped
    environment:
      CASSANDRA_START_RPC: 'true'
    ports:
      - "9042:9042"
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e \"describe cluster\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - roadwatch

  # Kafka - Local Message Broker
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.0
    container_name: roadwatch_zookeeper
    restart: unless-stopped
    environment:
      ZK_SERVER_HEAP: "-Xms128m -Xmx256m"
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 5
      ZOOKEEPER_INIT_LIMIT: 10
    ports:
      - "2181:2181"
    networks:
      - roadwatch

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: roadwatch_kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_started
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx512m"
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9094,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_RETENTION_HOURS: 24
    ports:
      - "9094:9092"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:29092"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - roadwatch

  # Redis - Local Cache
  redis:
    image: redis:7.2-alpine
    container_name: roadwatch_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - roadwatch

  # Scheduler - Background jobs & Cron jobs (Local Dev)
  scheduler:
    build:
      context: .
      dockerfile: services/scheduler/Dockerfile
    container_name: roadwatch_scheduler
    restart: unless-stopped
    depends_on:
      cassandra:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_started
    environment:
      NODE_ENV: development
      DEBUG: 'roadwatch:*'
      CASSANDRA_CONTACT_POINTS: cassandra:9042
      CASSANDRA_KEYSPACE: roadwatch
      CASSANDRA_LOCAL_DC: datacenter1
      SERVICE_NAME: scheduler
      REDIS_URL: redis://redis:6379/0
      KAFKA_BROKERS: kafka:29092
      CRON_SYNC_QUEUE: "*/5 * * * *"
      CRON_KARMA_RECALC: "0 * * * *"
      CRON_SLA_CHECK: "*/30 * * * *"
      CRON_AUDIT_CLEANUP: "0 2 * * *"
      CRON_REPORT_GENERATION: "0 1 * * *"
      LOG_LEVEL: debug
    networks:
      - roadwatch
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Webhook Handler - Event Scheduler & Kafka Consumer (Local Dev)
  webhook-handler:
    build:
      context: .
      dockerfile: services/webhook-handler/Dockerfile
    container_name: roadwatch_webhook_handler
    restart: unless-stopped
    depends_on:
      cassandra:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_started
    environment:
      NODE_ENV: development
      DEBUG: 'roadwatch:*'
      CASSANDRA_CONTACT_POINTS: cassandra:9042
      CASSANDRA_KEYSPACE: roadwatch
      CASSANDRA_LOCAL_DC: datacenter1
      KAFKA_BROKERS: kafka:29092
      KAFKA_GROUP_ID: webhook-handler-dev
      KAFKA_CONSUMER_TIMEOUT: "3000"
      SERVICE_NAME: webhook-handler
      REDIS_URL: redis://redis:6379/1
      LOG_LEVEL: debug
    networks:
      - roadwatch
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Fabric Anchor Consumer - Blockchain Consumer (Local Dev)
  fabric-anchor-consumer:
    build:
      context: .
      dockerfile: services/fabric-anchor-consumer/Dockerfile
    container_name: roadwatch_fabric_anchor_consumer
    restart: unless-stopped
    depends_on:
      cassandra:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_started
    environment:
      NODE_ENV: development
      DEBUG: 'roadwatch:*'
      CASSANDRA_CONTACT_POINTS: cassandra:9042
      CASSANDRA_KEYSPACE: roadwatch
      CASSANDRA_LOCAL_DC: datacenter1
      KAFKA_BROKERS: kafka:29092
      KAFKA_GROUP_ID: fabric-anchor-consumer-dev
      REDIS_URL: redis://redis:6379/2
      FABRIC_PEER_ENDPOINT: peer0.nhai.example.com:7051
      FABRIC_MSP_ID: NHAIMSP
      FABRIC_CHANNEL_NAME: roadwatch-india
      FABRIC_CHAINCODE_NAME: complaint-anchor
      LOG_LEVEL: debug
    networks:
      - roadwatch
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # One-time Cassandra initialization (runs cql script)
  cassandra-init:
    image: cassandra:4.1
    container_name: roadwatch_cassandra_init
    depends_on:
      cassandra:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: ["until cqlsh cassandra -e 'describe cluster' 2>/dev/null; do sleep 2; done; cqlsh cassandra -f /scripts/init.cql || true; sleep 1"]
    volumes:
      - ./docker/cassandra:/scripts:ro
    networks:
      - roadwatch

networks:
  roadwatch:
    driver: bridge

volumes:
  cassandra_data: