# cryptogen configuration for RoadWatch Fabric network
# Used by fabric/network/scripts/start.sh

OrdererOrgs:
  - Name: Orderer
    Domain: orderer.roadwatch.com
    EnableNodeOUs: true
    Specs:
      - Hostname: orderer1
        SANS:
          - localhost
          - 127.0.0.1

PeerOrgs:
  - Name: NHAI
    Domain: nhai.roadwatch.com
    EnableNodeOUs: true
    Template:
      Count: 1
      SANS:
        - localhost
        - 127.0.0.1
    Users:
      Count: 1

  - Name: RoadWatch
    Domain: roadwatch.roadwatch.com
    EnableNodeOUs: true
    Template:
      Count: 1
      SANS:
        - localhost
        - 127.0.0.1
    Users:
      Count: 1
