# Lightweight HLF dev network with LevelDB (no CouchDB by default)
# Profile "couchdb" enables CouchDB for rich queries if needed

networks:
  roadwatch:
    name: ${FABRIC_NETWORK_NAME:-roadwatch-fabric-net}
    driver: bridge
    ipam:
      config:
        - subnet: ${FABRIC_DOCKER_SUBNET:-172.30.0.0/24}

volumes:
  roadwatch-fabric-orderer1:
  roadwatch-fabric-peer0-nhai:
  roadwatch-fabric-peer0-roadwatch:

services:

  ca.nhai.roadwatch.com:
    image: hyperledger/fabric-ca:1.5
    container_name: ${FABRIC_CA_NHAI_CONTAINER_NAME:-roadwatch-fabric-ca-nhai}
    restart: unless-stopped
    environment:
      FABRIC_CA_HOME: /etc/hyperledger/fabric-ca-server
      FABRIC_CA_SERVER_CA_NAME: ca-nhai
      FABRIC_CA_SERVER_TLS_ENABLED: 'true'
      FABRIC_CA_SERVER_PORT: '7054'
      FABRIC_CA_SERVER_CACOUNT: '1'
      FABRIC_CA_SERVER_DEBUG: 'false'
    ports:
      - "${FABRIC_NHAI_CA_PORT:-17054}:7054"
    volumes:
      - ../organizations/peerOrganizations/nhai.roadwatch.com/ca/:/etc/hyperledger/fabric-ca-server
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    networks:
      - roadwatch

  ca.roadwatch.roadwatch.com:
    image: hyperledger/fabric-ca:1.5
    container_name: ${FABRIC_CA_ROADWATCH_CONTAINER_NAME:-roadwatch-fabric-ca-roadwatch}
    restart: unless-stopped
    environment:
      FABRIC_CA_HOME: /etc/hyperledger/fabric-ca-server
      FABRIC_CA_SERVER_CA_NAME: ca-roadwatch
      FABRIC_CA_SERVER_TLS_ENABLED: 'true'
      FABRIC_CA_SERVER_PORT: '8054'
      FABRIC_CA_SERVER_CACOUNT: '1'
      FABRIC_CA_SERVER_DEBUG: 'false'
    ports:
      - "${FABRIC_ROADWATCH_CA_PORT:-18054}:8054"
    volumes:
      - ../organizations/peerOrganizations/roadwatch.roadwatch.com/ca/:/etc/hyperledger/fabric-ca-server
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    networks:
      - roadwatch

  orderer1.orderer.roadwatch.com:
    image: hyperledger/fabric-orderer:2.5
    container_name: ${FABRIC_ORDERER_CONTAINER_NAME:-roadwatch-fabric-orderer1}
    restart: unless-stopped
    environment:
      FABRIC_LOGGING_SPEC: INFO
      ORDERER_GENERAL_LISTENADDRESS: 0.0.0.0
      ORDERER_GENERAL_LISTENPORT: '7050'
      ORDERER_GENERAL_LOCALMSPID: OrdererMSP
      ORDERER_GENERAL_LOCALMSPDIR: /var/hyperledger/orderer/msp
      ORDERER_GENERAL_TLS_ENABLED: 'true'
      ORDERER_GENERAL_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_GENERAL_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_GENERAL_TLS_ROOTCAS: '[/var/hyperledger/orderer/tls/ca.crt]'
      ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_GENERAL_CLUSTER_ROOTCAS: '[/var/hyperledger/orderer/tls/ca.crt]'
      ORDERER_GENERAL_BOOTSTRAPMETHOD: file
      ORDERER_GENERAL_BOOTSTRAPFILE: /var/hyperledger/orderer/orderer.genesis.block
      ORDERER_METRICS_PROVIDER: disabled
    command: orderer
    volumes:
      - ../channel-artifacts/genesis.block:/var/hyperledger/orderer/orderer.genesis.block:ro
      - ../organizations/ordererOrganizations/orderer.roadwatch.com/orderers/orderer1.orderer.roadwatch.com/msp:/var/hyperledger/orderer/msp:ro
      - ../organizations/ordererOrganizations/orderer.roadwatch.com/orderers/orderer1.orderer.roadwatch.com/tls:/var/hyperledger/orderer/tls:ro
      - roadwatch-fabric-orderer1:/var/hyperledger/production/orderer
    ports:
      - "${FABRIC_ORDERER_PORT:-17050}:7050"
    networks:
      - roadwatch

  peer0.nhai.roadwatch.com:
    image: hyperledger/fabric-peer:2.5
    container_name: ${FABRIC_NHAI_PEER_CONTAINER_NAME:-roadwatch-fabric-peer0-nhai}
    restart: unless-stopped
    environment:
      CORE_VM_ENDPOINT: unix:///host/var/run/docker.sock
      CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE: ${FABRIC_NETWORK_NAME:-roadwatch-fabric-net}
      FABRIC_LOGGING_SPEC: INFO
      CORE_PEER_TLS_ENABLED: 'true'
      CORE_PEER_PROFILE_ENABLED: 'false'
      CORE_PEER_TLS_CERT_FILE: /etc/hyperledger/fabric/tls/server.crt
      CORE_PEER_TLS_KEY_FILE: /etc/hyperledger/fabric/tls/server.key
      CORE_PEER_TLS_ROOTCERT_FILE: /etc/hyperledger/fabric/tls/ca.crt
      CORE_PEER_ID: peer0.nhai.roadwatch.com
      CORE_PEER_ADDRESS: peer0.nhai.roadwatch.com:7051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:7051
      CORE_PEER_CHAINCODEADDRESS: peer0.nhai.roadwatch.com:7052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:7052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.nhai.roadwatch.com:7051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.nhai.roadwatch.com:7051
      CORE_PEER_LOCALMSPID: NHAIMSP
      CORE_PEER_MSPCONFIGPATH: /etc/hyperledger/fabric/msp
      CORE_OPERATIONS_LISTENADDRESS: 0.0.0.0:9444
      CORE_METRICS_PROVIDER: disabled
      CORE_LEDGER_STATE_STATEDATABASE: goleveldb
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock:rw
      - ../organizations/peerOrganizations/nhai.roadwatch.com/peers/peer0.nhai.roadwatch.com/msp:/etc/hyperledger/fabric/msp:ro
      - ../organizations/peerOrganizations/nhai.roadwatch.com/peers/peer0.nhai.roadwatch.com/tls:/etc/hyperledger/fabric/tls:ro
      - roadwatch-fabric-peer0-nhai:/var/hyperledger/production
    command: peer node start
    ports:
      - "${FABRIC_NHAI_PEER_PORT:-17051}:7051"
      - "${FABRIC_NHAI_CHAINCODE_PORT:-17052}:7052"
      - "${FABRIC_NHAI_OPERATIONS_PORT:-17444}:9444"
    networks:
      - roadwatch

  peer0.roadwatch.roadwatch.com:
    image: hyperledger/fabric-peer:2.5
    container_name: ${FABRIC_ROADWATCH_PEER_CONTAINER_NAME:-roadwatch-fabric-peer0-roadwatch}
    restart: unless-stopped
    environment:
      CORE_VM_ENDPOINT: unix:///host/var/run/docker.sock
      CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE: ${FABRIC_NETWORK_NAME:-roadwatch-fabric-net}
      FABRIC_LOGGING_SPEC: INFO
      CORE_PEER_TLS_ENABLED: 'true'
      CORE_PEER_PROFILE_ENABLED: 'false'
      CORE_PEER_TLS_CERT_FILE: /etc/hyperledger/fabric/tls/server.crt
      CORE_PEER_TLS_KEY_FILE: /etc/hyperledger/fabric/tls/server.key
      CORE_PEER_TLS_ROOTCERT_FILE: /etc/hyperledger/fabric/tls/ca.crt
      CORE_PEER_ID: peer0.roadwatch.roadwatch.com
      CORE_PEER_ADDRESS: peer0.roadwatch.roadwatch.com:9051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:9051
      CORE_PEER_CHAINCODEADDRESS: peer0.roadwatch.roadwatch.com:9052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:9052
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.roadwatch.roadwatch.com:9051
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.roadwatch.roadwatch.com:9051
      CORE_PEER_LOCALMSPID: RoadWatchMSP
      CORE_PEER_MSPCONFIGPATH: /etc/hyperledger/fabric/msp
      CORE_OPERATIONS_LISTENADDRESS: 0.0.0.0:9445
      CORE_METRICS_PROVIDER: disabled
      CORE_LEDGER_STATE_STATEDATABASE: goleveldb
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock:rw
      - ../organizations/peerOrganizations/roadwatch.roadwatch.com/peers/peer0.roadwatch.roadwatch.com/msp:/etc/hyperledger/fabric/msp:ro
      - ../organizations/peerOrganizations/roadwatch.roadwatch.com/peers/peer0.roadwatch.roadwatch.com/tls:/etc/hyperledger/fabric/tls:ro
      - roadwatch-fabric-peer0-roadwatch:/var/hyperledger/production
    command: peer node start
    ports:
      - "${FABRIC_ROADWATCH_PEER_PORT:-19051}:9051"
      - "${FABRIC_ROADWATCH_CHAINCODE_PORT:-19052}:9052"
      - "${FABRIC_ROADWATCH_OPERATIONS_PORT:-19445}:9445"
    networks:
      - roadwatch

  couchdb.nhai:
    profiles: ["couchdb"]
    image: couchdb:3.3.2
    container_name: ${FABRIC_COUCHDB_NHAI_CONTAINER_NAME:-roadwatch-fabric-couchdb-nhai}
    restart: unless-stopped
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: adminpw
    ports:
      - "${FABRIC_COUCHDB_NHAI_PORT:-15984}:5984"
    networks:
      - roadwatch

  couchdb.roadwatch:
    profiles: ["couchdb"]
    image: couchdb:3.3.2
    container_name: ${FABRIC_COUCHDB_ROADWATCH_CONTAINER_NAME:-roadwatch-fabric-couchdb-roadwatch}
    restart: unless-stopped
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: adminpw
    ports:
      - "${FABRIC_COUCHDB_ROADWATCH_PORT:-25984}:5984"
    networks:
      - roadwatch