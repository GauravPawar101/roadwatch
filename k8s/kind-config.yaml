kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: roadwatch
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # Frontend NodePort 30080
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
      # Gateway API NodePort 30100 (matches frontend-config VITE_API_BASE)
      - containerPort: 30100
        hostPort: 30100
        protocol: TCP
      # Backend API NodePort 30401
      - containerPort: 30401
        hostPort: 30401
        protocol: TCP
      # Grafana NodePort 30301 (observability stack)
      - containerPort: 30301
        hostPort: 30301
        protocol: TCP
      # Prometheus NodePort 30090
      - containerPort: 30090
        hostPort: 30090
        protocol: TCP
