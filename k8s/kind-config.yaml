kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: roadwatch
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # Frontend
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
      # Gateway API
      - containerPort: 30100
        hostPort: 3100
        protocol: TCP
      # Backend API
      - containerPort: 30401
        hostPort: 4001
        protocol: TCP
