apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: roadwatch
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: roadwatch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        app.kubernetes.io/name: redis
    spec:
      containers:
        - name: redis
          image: redis:7.2-alpine
          command:
            - redis-server
            - "--appendonly"
            - "yes"
            - "--maxmemory"
            - "256mb"
            - "--maxmemory-policy"
            - "allkeys-lru"
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "384Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: redis             # → "redis" inside the namespace
  namespace: roadwatch
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: roadwatch
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
