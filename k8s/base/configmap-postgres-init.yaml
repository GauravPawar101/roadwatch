apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-sql
  namespace: roadwatch
  labels:
    app.kubernetes.io/part-of: roadwatch
data:
  # The full schema is kept in docker/postgres/init.sql which is the canonical
  # single source of truth. This ConfigMap is populated by ops/deploy/deploy-kind.ps1
  # at deploy time using:
  #   kubectl create configmap postgres-init-sql \
  #     --from-file=init.sql=docker/postgres/init.sql \
  #     -n roadwatch --dry-run=client -o yaml | kubectl apply -f -
  #
  # Keeping an empty placeholder here so the kustomization base is syntactically
  # valid and the postgres Deployment volume mount does not fail.
  init.sql: |
    -- Populated at deploy time from docker/postgres/init.sql
    -- Run: ops/deploy/deploy-kind.ps1 which calls kubectl create configmap
    SELECT 1;
