metadata:
  name: postgres-primary
  namespace: roadwatch
  labels:
    app.kubernetes.io/name: postgres-primary
    app.kubernetes.io/part-of: roadwatch
    layer: platform
spec:
  clusterIP: None
  selector:
    app: postgres-primary
    postgres-role: primary
  ports:
    - name: pg
      port: 5432
      targetPort: pg
