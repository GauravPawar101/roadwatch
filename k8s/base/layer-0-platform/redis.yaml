apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: roadwatch
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: roadwatch
    layer: platform
data:
  redis.conf: |
    bind 0.0.0.0
    port 6379
    appendonly yes
    maxmemory 256mb
    maxmemory-policy allkeys-lru
    save 900 1
    save 300 10
    protected-mode no
  redis-start.sh: |
    #!/bin/sh
    set -eu
    ORDINAL="${HOSTNAME##*-}"
    cp /config/redis.conf /data/redis.conf
    if [ "$ORDINAL" != "0" ]; then
      echo "replicaof redis-0.redis.roadwatch.svc.cluster.local 6379" >> /data/redis.conf
    fi
    exec redis-server /data/redis.conf
  sentinel.conf: |
    port 26379
    bind 0.0.0.0
    protected-mode no
    sentinel resolve-hostnames yes
    sentinel announce-hostnames yes
    sentinel monitor mymaster redis-0.redis.roadwatch.svc.cluster.local 6379 2
    sentinel down-after-milliseconds mymaster 5000
    sentinel failover-timeout mymaster 10000
    sentinel parallel-syncs mymaster 1
  sentinel-start.sh: |
    #!/bin/sh
    set -eu
    cp /config-readonly/sentinel.conf /tmp/sentinel.conf
    echo "Waiting for redis-0 DNS resolution"
    until nslookup redis-0.redis.roadwatch.svc.cluster.local >/dev/null 2>&1; do
      echo "redis-0 DNS not ready yet, sleeping 2s..."
      sleep 2
    done 
    exec redis-sentinel /tmp/sentinel.conf
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: roadwatch
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: roadwatch
    layer: platform
spec:
  serviceName: redis
  replicas: 3
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
      labels:
        mesh.roadwatch.io/role: infra
        app: redis
        app.kubernetes.io/name: redis
        layer: platform
    spec:
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 999:999 /data"]
          volumeMounts:
            - name: redis-data
              mountPath: /data
            - name: redis-config
              mountPath: /config
          securityContext:
            runAsUser: 0
        - name: wait-for-redis
          image: busybox:1.36
          command:
            [
              "sh",
              "-c",
              'ORDINAL="${HOSTNAME##*-}"; if [ "$ORDINAL" != "0" ]; then until nslookup redis-0.redis.roadwatch.svc.cluster.local; do echo waiting for redis-0; sleep 2; done; fi',
            ]
      containers:
        - name: redis
          image: redis:7.2-alpine
          command: ["/config/redis-start.sh"]
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: redis-data
              mountPath: /data
            - name: redis-config
              mountPath: /config
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "384Mi"
      volumes:
        - name: redis-config
          configMap:
            name: redis-config
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: redis-data
        labels:
          app.kubernetes.io/part-of: roadwatch
          layer: platform
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-sentinel
  namespace: roadwatch
  labels:
    app.kubernetes.io/name: redis-sentinel
    app.kubernetes.io/part-of: roadwatch
    layer: platform
spec:
  serviceName: redis-sentinel
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: redis-sentinel
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
      labels:
        mesh.roadwatch.io/role: infra
        app: redis-sentinel
        app.kubernetes.io/name: redis-sentinel
        layer: platform
    spec:
      terminationGracePeriodSeconds: 15
      containers:
        - name: sentinel
          image: redis:7.2-alpine
          command: ["/config-readonly/sentinel-start.sh"]
          ports:
            - name: sentinel
              containerPort: 26379
          volumeMounts:
            - name: sentinel-config
              mountPath: /config-readonly
          readinessProbe:
            exec:
              command: ["redis-cli", "-p", "26379", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["redis-cli", "-p", "26379", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
      volumes:
        - name: sentinel-config
          configMap:
            name: redis-config
            defaultMode: 0755
---
# Headless service for StatefulSet DNS (redis-0.redis.roadwatch)
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: roadwatch
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: roadwatch
    layer: platform
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
# Stable master selector — always routes to redis-0 (apps use master DNS directly)
apiVersion: v1
kind: Service
metadata:
  name: redis-master
  namespace: roadwatch
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: roadwatch
    layer: platform
spec:
  selector:
    app: redis
    statefulset.kubernetes.io/pod-name: redis-0
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
# Legacy alias — points at redis-0 for write traffic
apiVersion: v1
kind: Service
metadata:
  name: redis-rw
  namespace: roadwatch
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: roadwatch
    layer: platform
spec:
  selector:
    app: redis
    statefulset.kubernetes.io/pod-name: redis-0
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: v1
kind: Service
metadata:
  name: redis-sentinel
  namespace: roadwatch
  labels:
    app.kubernetes.io/name: redis-sentinel
    app.kubernetes.io/part-of: roadwatch
    layer: platform
spec:
  clusterIP: None
  selector:
    app: redis-sentinel
  ports:
    - name: sentinel
      port: 26379
      targetPort: sentinel
