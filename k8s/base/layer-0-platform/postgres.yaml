# ── Postgres — StatefulSet ────────────────────────────────────────────────────
# StatefulSet gives a stable pod hostname (postgres-0.postgres) so that
# PgBouncer, gateway-api, and all consumers always connect to the same identity.
# Data is durable across pod restarts via a PVC.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: roadwatch
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: roadwatch
    layer: platform
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
      labels:
        mesh.roadwatch.io/role: infra
        app: postgres
        app.kubernetes.io/name: postgres
        layer: platform
    spec:
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 999:999 /var/lib/postgresql/data"]
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          securityContext:
            runAsUser: 0
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: pg
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: infra-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: infra-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "roadwatch"]
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 6
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 5
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
      volumes:
        - name: init-sql
          configMap:
            name: postgres-init-sql
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
        labels:
          app.kubernetes.io/part-of: roadwatch
          layer: platform
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
# Headless Service for StatefulSet DNS (postgres-0.postgres.roadwatch)
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: roadwatch
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: roadwatch
    layer: platform
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: pg
      port: 5432
      targetPort: pg
---
# ClusterIP alias — PgBouncer and legacy code use "postgres:5432"
apiVersion: v1
kind: Service
metadata:
  name: postgres-rw
  namespace: roadwatch
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: roadwatch
    layer: platform
spec:
  selector:
    app: postgres
  ports:
    - name: pg
      port: 5432
      targetPort: pg
