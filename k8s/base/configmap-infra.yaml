apiVersion: v1
kind: ConfigMap
metadata:
  name: infra-config
  namespace: roadwatch
  labels:
    app.kubernetes.io/part-of: roadwatch
data:
  # ── Postgres ──────────────────────────────────────────────────
  # Short name "postgres" resolves inside the roadwatch namespace.
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB:   "roadwatch"
  POSTGRES_USER: "postgres"

  # ── PgBouncer (connection pooler in front of Postgres) ────────
  PGBOUNCER_HOST: "pgbouncer"
  PGBOUNCER_PORT: "6432"
  # DATABASE_URL is assembled per-pod via $(VAR) substitution so the
  # password never lives in a ConfigMap. Pattern used in every Deployment:
  #   postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(PGBOUNCER_HOST):$(PGBOUNCER_PORT)/$(POSTGRES_DB)

  # ── Kafka ─────────────────────────────────────────────────────
  # "kafka" resolves to the kafka ClusterIP Service inside the namespace.
  KAFKA_BROKERS: "kafka:29092"
  KAFKA_BROKER:  "kafka:29092"

  # ── Redis ─────────────────────────────────────────────────────
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  # Default REDIS_URL (db 0) — overridden per-pod for webhook (db 1) and fabric (db 2).
  REDIS_URL: "redis://redis:6379/0"

  # ── Internal service discovery ────────────────────────────────
  # Services in the same namespace are reachable by short name.
  GATEWAY_URL:  "http://gateway:3100"
  BACKEND_URL:  "http://backend:4001"