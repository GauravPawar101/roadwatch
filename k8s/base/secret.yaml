apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: roadwatch
  labels:
    app.kubernetes.io/part-of: roadwatch
type: Opaque
stringData:
  # ── Postgres ──────────────────────────────────────────────────
  POSTGRES_PASSWORD: "postgres"

  # ── Auth ──────────────────────────────────────────────────────
  JWT_SECRET:              "roadwatch-local-dev-jwt-secret-replace-in-production"
  ACCESS_SECRET:           "roadwatch-local-dev-jwt-secret-replace-in-production"
  REFRESH_SECRET:          "roadwatch-local-dev-jwt-secret-replace-in-production"
  SERVICE_AUTH_SECRET:     "local_development_cryptographic_secret"
  SERVICE_REGISTRY_SECRET: "roadwatch-local-service-registry-secret"

  # ── Supabase ──────────────────────────────────────────────────
  SUPABASE_URL:      "https://placeholder.supabase.co"
  SUPABASE_ANON_KEY: "placeholder"

  # ── Optional — fill in when needed ───────────────────────────
  # GEMINI_API_KEY:     ""
  # PHONE_HASH_PEPPER:  ""
  # PHONE_ENC_KEY:      ""
  # FCM_SERVER_KEY:     ""
  # TWILIO_ACCOUNT_SID: ""
  # TWILIO_AUTH_TOKEN:  ""
