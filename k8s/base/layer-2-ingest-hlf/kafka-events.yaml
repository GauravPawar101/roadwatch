# ═══════════════════════════════════════════════════════════════════════════════
# LAYER 2 — INGEST.HLF: Zookeeper + Kafka (operational events cluster)
#
# SLA checks, notifications, authority actions, complaint fan-out, and triggers.
# webhook-handler is the primary subscriber on this cluster.
# ═══════════════════════════════════════════════════════════════════════════════

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zookeeper-events
  namespace: roadwatch
  labels:
    app.kubernetes.io/name: zookeeper-events
    app.kubernetes.io/part-of: roadwatch
    layer: ingest-hlf
    kafka-cluster: events
spec:
  serviceName: zookeeper-events
  replicas: 1
  selector:
    matchLabels:
      app: zookeeper-events
  template:
    metadata:
      labels:
        app: zookeeper-events
        app.kubernetes.io/name: zookeeper-events
        layer: ingest-hlf
        kafka-cluster: events
    spec:
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 1000:1000 /var/lib/zookeeper"]
          volumeMounts:
            - name: zookeeper-data
              mountPath: /var/lib/zookeeper/data
            - name: zookeeper-log
              mountPath: /var/lib/zookeeper/log
          securityContext:
            runAsUser: 0
      containers:
        - name: zookeeper
          image: confluentinc/cp-zookeeper:7.7.0
          ports:
            - name: client
              containerPort: 2181
          env:
            - name: ZOOKEEPER_CLIENT_PORT
              value: "2181"
            - name: ZOOKEEPER_TICK_TIME
              value: "2000"
            - name: ZOOKEEPER_INIT_LIMIT
              value: "10"
            - name: ZOOKEEPER_SYNC_LIMIT
              value: "5"
            - name: KAFKA_HEAP_OPTS
              value: "-Xms128m -Xmx256m"
          readinessProbe:
            tcpSocket:
              port: client
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 12
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: client
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 5
            timeoutSeconds: 3
          volumeMounts:
            - name: zookeeper-data
              mountPath: /var/lib/zookeeper/data
            - name: zookeeper-log
              mountPath: /var/lib/zookeeper/log
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "384Mi"
  volumeClaimTemplates:
    - metadata:
        name: zookeeper-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
    - metadata:
        name: zookeeper-log
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper-events
  namespace: roadwatch
  labels:
    app.kubernetes.io/name: zookeeper-events
    app.kubernetes.io/part-of: roadwatch
    layer: ingest-hlf
    kafka-cluster: events
spec:
  clusterIP: None
  selector:
    app: zookeeper-events
  ports:
    - name: client
      port: 2181
      targetPort: client
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka-events
  namespace: roadwatch
  labels:
    app.kubernetes.io/name: kafka-events
    app.kubernetes.io/part-of: roadwatch
    layer: ingest-hlf
    kafka-cluster: events
spec:
  serviceName: kafka-events-headless
  replicas: 1
  selector:
    matchLabels:
      app: kafka-events
  template:
    metadata:
      labels:
        app: kafka-events
        app.kubernetes.io/name: kafka-events
        layer: ingest-hlf
        kafka-cluster: events
    spec:
      terminationGracePeriodSeconds: 60
      enableServiceLinks: false
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 1000:1000 /var/lib/kafka/data"]
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
          securityContext:
            runAsUser: 0
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.7.0
          ports:
            - name: internal
              containerPort: 29092
          env:
            - name: KAFKA_BROKER_ID
              value: "1"
            - name: KAFKA_HEAP_OPTS
              value: "-Xms256m -Xmx512m"
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: "zookeeper-events-0.zookeeper-events.roadwatch.svc.cluster.local:2181"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:29092"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka-events-0.kafka-events-headless.roadwatch.svc.cluster.local:29092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "PLAINTEXT:PLAINTEXT"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
            - name: KAFKA_NUM_PARTITIONS
              value: "3"
            - name: KAFKA_LOG_RETENTION_HOURS
              value: "24"
            - name: KAFKA_LOG_DIRS
              value: "/var/lib/kafka/data"
          readinessProbe:
            tcpSocket:
              port: internal
            initialDelaySeconds: 40
            periodSeconds: 10
            failureThreshold: 15
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: internal
            initialDelaySeconds: 90
            periodSeconds: 20
            failureThreshold: 5
            timeoutSeconds: 5
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "768Mi"
  volumeClaimTemplates:
    - metadata:
        name: kafka-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-events-headless
  namespace: roadwatch
  labels:
    app.kubernetes.io/name: kafka-events
    app.kubernetes.io/part-of: roadwatch
    layer: ingest-hlf
    kafka-cluster: events
spec:
  clusterIP: None
  selector:
    app: kafka-events
  ports:
    - name: internal
      port: 29092
      targetPort: internal
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-events
  namespace: roadwatch
  labels:
    app.kubernetes.io/name: kafka-events
    app.kubernetes.io/part-of: roadwatch
    layer: ingest-hlf
    kafka-cluster: events
spec:
  selector:
    app: kafka-events
  ports:
    - name: internal
      port: 29092
      targetPort: internal
