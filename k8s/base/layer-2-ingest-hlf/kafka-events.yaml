# ═══════════════════════════════════════════════════════════════════════════════
# LAYER 2 — INGEST.HLF: Kafka operational events cluster (KRaft, 3 brokers)
#
# SLA checks, notifications, authority actions, complaint fan-out, and triggers.
# webhook-handler is the primary subscriber on this cluster.
# ═══════════════════════════════════════════════════════════════════════════════

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka-events
  namespace: roadwatch
  labels:
    app.kubernetes.io/name: kafka-events
    app.kubernetes.io/part-of: roadwatch
    layer: ingest-hlf
    kafka-cluster: events
spec:
  serviceName: kafka-events-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: kafka-events
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
      labels:
        mesh.roadwatch.io/role: infra
        app: kafka-events
        app.kubernetes.io/name: kafka-events
        layer: ingest-hlf
        kafka-cluster: events
    spec:
      terminationGracePeriodSeconds: 60
      enableServiceLinks: false
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 1000:1000 /var/lib/kafka/data"]
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
            - name: kafka-startup
              mountPath: /scripts
          securityContext:
            runAsUser: 0
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.7.0
          command: ["/scripts/kafka-start.sh"]
          ports:
            - name: internal
              containerPort: 29092
            - name: controller
              containerPort: 9093
          env:
            - name: KAFKA_HEADLESS_SERVICE
              value: "kafka-events-headless"
            - name: CLUSTER_ID
              value: "NjdERUYwNzQxNzQ1NDQwMQ"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_HEAP_OPTS
              value: "-Xms256m -Xmx512m"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "0@kafka-events-0.kafka-events-headless.roadwatch.svc.cluster.local:9093,1@kafka-events-1.kafka-events-headless.roadwatch.svc.cluster.local:9093,2@kafka-events-2.kafka-events-headless.roadwatch.svc.cluster.local:9093"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "3"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "3"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "2"
            - name: KAFKA_DEFAULT_REPLICATION_FACTOR
              value: "3"
            - name: KAFKA_MIN_INSYNC_REPLICAS
              value: "2"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
            - name: KAFKA_NUM_PARTITIONS
              value: "3"
            - name: KAFKA_LOG_RETENTION_HOURS
              value: "24"
            - name: KAFKA_LOG_DIRS
              value: "/var/lib/kafka/data"
          readinessProbe:
            tcpSocket:
              port: internal
            initialDelaySeconds: 40
            periodSeconds: 10
            failureThreshold: 15
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: internal
            initialDelaySeconds: 90
            periodSeconds: 20
            failureThreshold: 5
            timeoutSeconds: 5
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
            - name: kafka-startup
              mountPath: /scripts
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "768Mi"
      volumes:
        - name: kafka-startup
          configMap:
            name: kafka-kraft-startup
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: kafka-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-events-headless
  namespace: roadwatch
  labels:
    app.kubernetes.io/name: kafka-events
    app.kubernetes.io/part-of: roadwatch
    layer: ingest-hlf
    kafka-cluster: events
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: kafka-events
  ports:
    - name: internal
      port: 29092
      targetPort: internal
    - name: controller
      port: 9093
      targetPort: controller
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-events
  namespace: roadwatch
  labels:
    app.kubernetes.io/name: kafka-events
    app.kubernetes.io/part-of: roadwatch
    layer: ingest-hlf
    kafka-cluster: events
spec:
  selector:
    app: kafka-events
  ports:
    - name: internal
      port: 29092
      targetPort: internal
