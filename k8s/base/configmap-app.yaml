apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: roadwatch
  labels:
    app.kubernetes.io/part-of: roadwatch
data:
  # ── Runtime ───────────────────────────────────────────────────
  NODE_ENV:  "production"
  LOG_LEVEL: "info"

  # ── Gateway API ───────────────────────────────────────────────
  PORT:               "3100"
  OTP_TTL_SECONDS:    "300"
  ALLOW_DEV_OTP_ECHO: "false"
  LLM_FALLBACK_ORDER: "gemini,ollama,llamacpp"
  SUPABASE_STORAGE_BUCKET: "roadwatch-media"

  # ── Backend API ───────────────────────────────────────────────
  BACKEND_PORT: "4001"

  # ── Scheduler cron schedules ──────────────────────────────────
  CRON_SYNC_QUEUE:        "*/5 * * * *"
  CRON_KARMA_RECALC:      "0 * * * *"
  CRON_SLA_CHECK:         "*/30 * * * *"
  CRON_AUDIT_CLEANUP:     "0 2 * * *"
  CRON_REPORT_GENERATION: "0 1 * * *"

  # ── Fabric (non-secret config) ────────────────────────────────
  FABRIC_MSP_ID:          "NHAIMSP"
  FABRIC_CHANNEL_NAME:    "roadwatch-channel"
  FABRIC_CHAINCODE_NAME:  "roadwatch"
  FABRIC_PEER_HOST_ALIAS: "peer0.nhai.roadwatch.com"
  # FABRIC_PEER_ENDPOINT is injected per-pod at deploy time (needs host IP)
  # Cert file paths come from the fabric-certs Secret volume mount
  FABRIC_TLS_CERT_PATH:  "/fabric/tls/ca.crt"
  FABRIC_X509_CERT_PATH: "/fabric/msp/cert.pem"
  FABRIC_X509_KEY_PATH:  "/fabric/msp/key.pem"
