# Layer mesh — Istio service identity (mTLS / SPIFFE). Applied after apps exist.
# Namespace injection is enabled by deploy-kind.sh; data-plane pods opt out.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway
  namespace: roadwatch
  labels:
    app.kubernetes.io/part-of: roadwatch
    layer: mesh
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
  namespace: roadwatch
  labels:
    app.kubernetes.io/part-of: roadwatch
    layer: mesh
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: webhook
  namespace: roadwatch
  labels:
    app.kubernetes.io/part-of: roadwatch
    layer: mesh
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fabric-anchor
  namespace: roadwatch
  labels:
    app.kubernetes.io/part-of: roadwatch
    layer: mesh
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scheduler
  namespace: roadwatch
  labels:
    app.kubernetes.io/part-of: roadwatch
    layer: mesh
