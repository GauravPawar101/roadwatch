# Connection pooling, retries, and outlier detection for low-latency HA east-west calls.
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: gateway
  namespace: roadwatch
  labels:
    app.kubernetes.io/part-of: roadwatch
    layer: mesh
spec:
  host: gateway.roadwatch.svc.cluster.local
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http1MaxPendingRequests: 100
        http2MaxRequests: 200
        maxRequestsPerConnection: 10
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 10s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
    loadBalancer:
      simple: LEAST_REQUEST
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: backend
  namespace: roadwatch
  labels:
    app.kubernetes.io/part-of: roadwatch
    layer: mesh
spec:
  host: backend.roadwatch.svc.cluster.local
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 80
      http:
        http1MaxPendingRequests: 80
        http2MaxRequests: 160
        maxRequestsPerConnection: 10
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 10s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
    loadBalancer:
      simple: LEAST_REQUEST
    tls:
      mode: ISTIO_MUTUAL
