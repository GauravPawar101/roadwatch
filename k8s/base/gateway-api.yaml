apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: roadwatch
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: roadwatch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
        app.kubernetes.io/name: gateway
    spec:
      containers:
        - name: gateway
          image: roadwatch/gateway-api:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 3100
          envFrom:
            - configMapRef:
                name: infra-config
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          env:
            - name: SERVICE_NAME
              value: "gateway"
            - name: SERVICE_URL
              value: "http://gateway:3100"
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(PGBOUNCER_HOST):$(PGBOUNCER_PORT)/$(POSTGRES_DB)"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: gateway           # → http://gateway:3100 inside the namespace
  namespace: roadwatch
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: roadwatch
spec:
  selector:
    app: gateway
  type: NodePort
  ports:
    - name: http
      port: 3100
      targetPort: http
      nodePort: 30100
