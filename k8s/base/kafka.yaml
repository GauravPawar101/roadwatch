apiVersion: apps/v1
kind: Deployment
metadata:
  name: zookeeper
  namespace: roadwatch
  labels:
    app.kubernetes.io/name: zookeeper
    app.kubernetes.io/part-of: roadwatch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zookeeper
  template:
    metadata:
      labels:
        app: zookeeper
        app.kubernetes.io/name: zookeeper
    spec:
      containers:
        - name: zookeeper
          image: confluentinc/cp-zookeeper:7.7.0
          ports:
            - name: zk
              containerPort: 2181
          env:
            - name: ZOOKEEPER_CLIENT_PORT
              value: "2181"
            - name: ZOOKEEPER_TICK_TIME
              value: "2000"
            - name: ZK_SERVER_HEAP
              value: "-Xms64m -Xmx128m"
          readinessProbe:
            exec:
              command: ["sh", "-c", "echo ruok | nc localhost 2181 | grep imok"]
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper         # → "zookeeper" inside the namespace
  namespace: roadwatch
  labels:
    app.kubernetes.io/name: zookeeper
    app.kubernetes.io/part-of: roadwatch
spec:
  selector:
    app: zookeeper
  ports:
    - name: zk
      port: 2181
      targetPort: zk
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: roadwatch
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: roadwatch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
        app.kubernetes.io/name: kafka
    spec:
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.7.0
          ports:
            - name: internal
              containerPort: 29092
            - name: external
              containerPort: 9092
          env:
            - name: KAFKA_BROKER_ID
              value: "1"
            - name: KAFKA_HEAP_OPTS
              value: "-Xms64m -Xmx256m"
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: "zookeeper:2181"    # short name
            - name: KAFKA_LISTENERS
              value: "INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "INTERNAL://kafka:29092,EXTERNAL://localhost:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "INTERNAL"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
            - name: KAFKA_LOG_RETENTION_HOURS
              value: "24"
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "kafka-topics --bootstrap-server localhost:29092 --list"
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 10
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: kafka             # → "kafka" inside the namespace (kafka:29092)
  namespace: roadwatch
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: roadwatch
spec:
  selector:
    app: kafka
  ports:
    - name: internal
      port: 29092
      targetPort: internal
    - name: external
      port: 9092
      targetPort: external
