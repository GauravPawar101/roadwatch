# Postgres + Redis exporters for Kind soak metrics (tup_fetched, redis hits).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  namespace: roadwatch
  labels:
    app.kubernetes.io/name: postgres-exporter
    app.kubernetes.io/part-of: roadwatch
    layer: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-exporter
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9187"
        prometheus.io/path: "/metrics"
      labels:
        app: postgres-exporter
        app.kubernetes.io/name: postgres-exporter
        layer: observability
        mesh.roadwatch.io/role: infra
    spec:
      containers:
        - name: postgres-exporter
          image: prometheuscommunity/postgres-exporter:v0.16.0
          ports:
            - name: http
              containerPort: 9187
          env:
            - name: DATA_SOURCE_URI
              value: postgres.roadwatch.svc.cluster.local:5432/roadwatch?sslmode=disable
            - name: DATA_SOURCE_USER
              valueFrom:
                configMapKeyRef:
                  name: infra-config
                  key: POSTGRES_USER
            - name: DATA_SOURCE_PASS
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
  namespace: roadwatch
  labels:
    app.kubernetes.io/name: postgres-exporter
    app.kubernetes.io/part-of: roadwatch
    layer: observability
spec:
  selector:
    app: postgres-exporter
  ports:
    - name: http
      port: 9187
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-exporter
  namespace: roadwatch
  labels:
    app.kubernetes.io/name: redis-exporter
    app.kubernetes.io/part-of: roadwatch
    layer: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-exporter
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9121"
        prometheus.io/path: "/metrics"
      labels:
        app: redis-exporter
        app.kubernetes.io/name: redis-exporter
        layer: observability
        mesh.roadwatch.io/role: infra
    spec:
      containers:
        - name: redis-exporter
          image: oliver006/redis_exporter:v1.66.0
          ports:
            - name: http
              containerPort: 9121
          env:
            - name: REDIS_ADDR
              value: redis://redis-0.redis.roadwatch.svc.cluster.local:6379
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis-exporter
  namespace: roadwatch
  labels:
    app.kubernetes.io/name: redis-exporter
    app.kubernetes.io/part-of: roadwatch
    layer: observability
spec:
  selector:
    app: redis-exporter
  ports:
    - name: http
      port: 9121
      targetPort: http
