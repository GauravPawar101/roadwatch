apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: roadwatch
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: roadwatch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        app.kubernetes.io/name: backend
    spec:
      containers:
        - name: backend
          image: roadwatch/backend-api:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 4001
          envFrom:
            - configMapRef:
                name: infra-config
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          env:
            - name: SERVICE_NAME
              value: "backend"
            - name: SERVICE_URL
              value: "http://backend:4001"
            - name: PORT
              value: "4001"
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(PGBOUNCER_HOST):$(PGBOUNCER_PORT)/$(POSTGRES_DB)"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: backend           # → http://backend:4001 inside the namespace
  namespace: roadwatch
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: roadwatch
spec:
  selector:
    app: backend
  type: NodePort
  ports:
    - name: http
      port: 4001
      targetPort: http
      nodePort: 30401
