apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: roadwatch

resources:
  - ../../base

patches:
  - path: configmap-app-patch.yaml
  - path: configmap-cluster-patch.yaml

replacements:
  - source:
      kind: ConfigMap
      name: cluster-config
      fieldPath: data.FABRIC_HOST_IP
    targets:
      - select:
          kind: Deployment
          name: fabric-anchor
        fieldPaths:
          - spec.template.spec.hostAliases.0.ip
