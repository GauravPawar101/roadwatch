apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: roadwatch
spec:
  template:
    spec:
      containers:
        - name: gateway
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "1Gi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: roadwatch
spec:
  template:
    spec:
      containers:
        - name: backend
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fabric-anchor
  namespace: roadwatch
spec:
  template:
    spec:
      containers:
        - name: fabric-anchor
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
