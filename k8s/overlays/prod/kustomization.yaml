apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No global `namespace:` here on purpose. Every base resource already declares
# its own namespace (roadwatch, or observability for the monitoring stack), and
# a global namespace rewrites the observability Namespace object to `roadwatch`,
# colliding with the platform Namespace:
#   "namespace transformation produces ID conflict: Namespace/roadwatch ..."
# which meant this overlay — and the aws overlay that inherits it — could not
# render at all.

resources:
  - ../../base

patches:
  - path: configmap-app-patch.yaml
  - path: configmap-cluster-patch.yaml
  - path: resource-limits-patch.yaml
  - patch: |-
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: gateway-hpa
        namespace: roadwatch
      spec:
        minReplicas: 2
        maxReplicas: 10
    target:
      kind: HorizontalPodAutoscaler
      name: gateway-hpa

replacements:
  - source:
      kind: ConfigMap
      name: cluster-config
      fieldPath: data.FABRIC_HOST_IP
    targets:
      - select:
          kind: Deployment
          name: fabric-anchor
        fieldPaths:
          - spec.template.spec.hostAliases.0.ip
